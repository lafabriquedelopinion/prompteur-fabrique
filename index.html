<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le prompteur a déménagé</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://lafabriquedelopinion.com/prompteur/">
<noscript><meta http-equiv="refresh" content="0; url=https://lafabriquedelopinion.com/prompteur/"></noscript>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#073D2C;color:#fff;font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box;text-align:center}
a{display:inline-flex;align-items:center;min-height:44px;padding:10px 18px;border-radius:8px;background:#C9A227;color:#16130C;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
<p>Le prompteur de la Fabrique a déménagé sur le site <strong>lafabriquedelopinion.com</strong>.</p>
<p><a id="lien" href="https://lafabriquedelopinion.com/prompteur/">Ouvrir le prompteur</a></p>
</main>
<script>
// Le prompteur est désormais sur https://lafabriquedelopinion.com/prompteur/.
// Le texte enregistré ici (localStorage, propre à cette adresse) est emporté une fois dans le fragment « #import=… »,
// qui n'est jamais envoyé à un serveur ; la nouvelle page le reprend s'il n'y a pas déjà un texte chez elle.
(function(){
  var cible="https://lafabriquedelopinion.com/prompteur/";
  function lire(k){try{return localStorage.getItem(k)}catch(e){return null}}
  var texte=lire("pf_text");
  if(texte&&lire("pf_demenage")!=="1"){
    var paquet={texte:texte,titre:lire("pf_title")||"",goal:lire("pf_goal")||"",speed:lire("pf_speed")||"",size:lire("pf_size")||"",mirror:lire("pf_mirror")||""};
    try{localStorage.setItem("pf_demenage","1")}catch(e){}
    cible+="#import="+encodeURIComponent(JSON.stringify(paquet));
  }
  document.getElementById("lien").href=cible;
  location.replace(cible);
})();
</script>
</body>
</html>
